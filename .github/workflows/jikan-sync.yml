name: Continuous Jikan sync

on:
  schedule:
    # Recovery trigger only. Successful runs dispatch their own successor.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# The successor is dispatched before the current run exits, so this group
# keeps it pending until the active database writer has finished.
concurrency:
  group: jikan-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import the current season
        run: python -m backend.jobs.jikan_etl --season current
      - name: Backfill five catalogue years from seasonal listings
        run: python -m backend.jobs.jikan_etl --backfill-seasons --year-limit 5
      - name: Refresh the next 1,000 catalogue records and Jikan season metadata
        run: python -m backend.jobs.jikan_etl --limit 1000
      - name: Queue the next catalogue batch
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jikan-sync.yml --ref main
