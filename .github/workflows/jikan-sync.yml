name: Every-three-hours Jikan sync

on:
  schedule:
    # GitHub Actions schedules use UTC. Run at the start of every third hour.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Keep database writes sequential if a manual run or a delayed schedule overlaps.
concurrency:
  group: jikan-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import the current season
        run: python -m backend.jobs.jikan_etl --season current
      - name: Refresh the oldest catalogue records
        run: python -m backend.jobs.jikan_etl --limit 500
