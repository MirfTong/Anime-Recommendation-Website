name: Continuous Jikan sync

on:
  schedule:
    # GitHub's shortest supported interval. Concurrency below ensures each
    # batch follows the previous one without concurrent database writes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Keep database writes sequential. If another schedule fires while a batch is
# active, GitHub retains the next queued run rather than issuing concurrent
# Jikan requests against the shared database.
concurrency:
  group: jikan-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import the current season
        run: python -m backend.jobs.jikan_etl --season current
      - name: Refresh the oldest catalogue records and Jikan season metadata
        run: python -m backend.jobs.jikan_etl --limit 500
