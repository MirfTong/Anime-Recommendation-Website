name: Scheduled catalogue metadata sync

on:
  schedule:
    # Anime, Manga, and Manhwa share one limiter across eight daily runs.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual runs never write to the database concurrently.
concurrency:
  group: jikan-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Sync Anime, Manga, and Manhwa
        run: python -m backend.jobs.jikan_etl --scheduled-sync --page-limit 40 --limit 1000
