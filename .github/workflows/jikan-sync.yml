name: Four-times-daily Jikan sync

on:
  schedule:
    # GitHub Actions schedules use UTC. These are midnight, 6 AM, noon, and
    # 6 PM EST (UTC-5).
    - cron: "0 5 * * *"
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

# Keep database writes sequential if a manual run or a delayed schedule overlaps.
concurrency:
  group: jikan-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import the current season
        run: python jikan_etl.py --season current
      - name: Refresh the oldest catalogue records
        run: python jikan_etl.py --limit 500
