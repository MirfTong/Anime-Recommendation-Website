name: Scheduled anime metadata sync

on:
  schedule:
    # Eight runs/day stays comfortably below the public provider's daily cap.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual runs never write to the database concurrently.
concurrency:
  group: jikan-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import the current season
        run: python -m backend.jobs.jikan_etl --season current
      - name: Update seasons from 40 bulk catalogue pages
        run: python -m backend.jobs.jikan_etl --bulk-seasons --page-limit 40
      - name: Backfill seasons for the next 1,000 TV anime
        run: python -m backend.jobs.jikan_etl --backfill-seasons --limit 1000
      - name: Refresh the next 1,000 catalogue records and season metadata
        run: python -m backend.jobs.jikan_etl --limit 1000
